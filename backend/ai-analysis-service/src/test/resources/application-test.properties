spring.datasource.url=jdbc:h2:mem:aianalysis;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
agentshield.events.dispatcher.enabled=false
agentshield.events.consumer.enabled=false
agentshield.security.jwt.issuer=http://localhost:19000
agentshield.security.jwt.jwk-set-uri=http://localhost:19000/oauth2/jwks
agentshield.security.jwt.user-audiences=agentshield-api
agentshield.security.jwt.gateway-audience=ai-analysis-api
agentshield.security.jwt.agent-audience=agentshield-runtime-api
agentshield.analysis.agent-management.base-url=http://localhost:8082
agentshield.security.runtime-gateway.analysis-client-id=runtime-gateway-analysis-test
agentshield.security.cors.allowed-origins=http://localhost:3000
agentshield.analysis.llm.enabled=false
spring.ai.model.chat=none
agentshield.analysis.request.max-bytes=1048576
agentshield.analysis.rate-limit.requests-per-minute=1000
