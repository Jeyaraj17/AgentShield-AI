spring.application.name=ai-analysis-service
server.port=${SERVER_PORT:8085}
spring.datasource.url=${AI_ANALYSIS_DB_URL}
spring.datasource.username=${AI_ANALYSIS_DB_USERNAME}
spring.datasource.password=${AI_ANALYSIS_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.ai.model.chat=${AI_LLM_PROVIDER:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.timeout=${AI_LLM_TIMEOUT:5s}
spring.ai.openai.max-retries=0
agentshield.security.jwt.issuer=${IDENTITY_ISSUER:}
agentshield.security.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:}
agentshield.security.jwt.user-audiences=${AI_ANALYSIS_ALLOWED_AUDIENCES:agentshield-api}
agentshield.security.jwt.gateway-audience=${AI_ANALYSIS_GATEWAY_AUDIENCE:ai-analysis-api}
agentshield.security.jwt.agent-audience=${AGENT_TOKEN_AUDIENCE:agentshield-runtime-api}
agentshield.security.runtime-gateway.analysis-client-id=${RUNTIME_GATEWAY_ANALYSIS_CLIENT_ID:agentshield-runtime-gateway-analysis}
agentshield.analysis.llm.enabled=${AI_LLM_ENABLED:false}
agentshield.analysis.request.max-bytes=${AI_ANALYSIS_MAX_REQUEST_BYTES:1048576}
agentshield.analysis.rate-limit.requests-per-minute=${AI_ANALYSIS_REQUESTS_PER_MINUTE:120}
agentshield.analysis.rate-limit.window=${AI_ANALYSIS_RATE_WINDOW:1m}
agentshield.analysis.behavior.baseline-size=${AI_ANALYSIS_BEHAVIOR_BASELINE_SIZE:20}
agentshield.analysis.behavior.minimum-samples=${AI_ANALYSIS_BEHAVIOR_MINIMUM_SAMPLES:5}
agentshield.analysis.behavior.drift-threshold=${AI_ANALYSIS_DRIFT_THRESHOLD:2.5}
agentshield.analysis.agent-management.base-url=${AGENT_MANAGEMENT_SERVICE_URL:}
agentshield.analysis.trust.weights.security=${AI_TRUST_WEIGHT_SECURITY:0.25}
agentshield.analysis.trust.weights.policy=${AI_TRUST_WEIGHT_POLICY:0.20}
agentshield.analysis.trust.weights.reliability=${AI_TRUST_WEIGHT_RELIABILITY:0.20}
agentshield.analysis.trust.weights.output=${AI_TRUST_WEIGHT_OUTPUT:0.20}
agentshield.analysis.trust.weights.drift=${AI_TRUST_WEIGHT_DRIFT:0.15}
agentshield.analysis.sensitive.patterns=${AI_SENSITIVE_PATTERNS:}
agentshield.analysis.bias-toxicity.rules=${AI_BIAS_TOXICITY_RULES:}
agentshield.security.cors.allowed-origins=${AI_ANALYSIS_CORS_ALLOWED_ORIGINS:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.com.agentshield.aianalysis=INFO
logging.level.org.springframework.security=WARN
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
agentshield.events.queue=${EVENT_QUEUE:agentshield.ai-analysis.events}
agentshield.events.dead-letter-queue=${EVENT_DLQ:agentshield.ai-analysis.events.dlq}
agentshield.events.dispatcher.enabled=${EVENT_DISPATCHER_ENABLED:true}
agentshield.events.consumer.enabled=${EVENT_CONSUMER_ENABLED:true}
