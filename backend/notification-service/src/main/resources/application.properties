spring.application.name=notification-service
server.port=${SERVER_PORT:8087}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${NOTIFICATION_DB_URL}
spring.datasource.username=${NOTIFICATION_DB_USERNAME}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
agentshield.security.jwt.issuer=${IDENTITY_ISSUER:}
agentshield.security.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:}
agentshield.security.jwt.audiences=${NOTIFICATION_SERVICE_AUDIENCE:agentshield-api,notification-service-api}
agentshield.security.cors.allowed-origins=${NOTIFICATION_CORS_ALLOWED_ORIGINS:}
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
agentshield.events.queue=${NOTIFICATION_EVENT_QUEUE:agentshield.notification-service.events}
agentshield.events.dead-letter-queue=${NOTIFICATION_EVENT_DLQ:agentshield.notification-service.events.dlq}
agentshield.events.dispatcher.enabled=false
agentshield.events.consumer.enabled=${EVENT_CONSUMER_ENABLED:true}
agentshield.events.consumer.max-attempts=${EVENT_CONSUMER_MAX_ATTEMPTS:4}
agentshield.events.consumer.initial-backoff-ms=${EVENT_CONSUMER_INITIAL_BACKOFF_MS:250}
agentshield.events.consumer.max-backoff-ms=${EVENT_CONSUMER_MAX_BACKOFF_MS:3000}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.com.agentshield.notification=INFO
logging.level.org.springframework.security=WARN
