spring.datasource.url=${AGENT_DB_URL:jdbc:mysql://localhost:3306/agent_management?connectionTimeZone=UTC}
spring.datasource.username=${AGENT_DB_USERNAME}
spring.datasource.password=${AGENT_DB_PASSWORD}
agentshield.security.jwt.issuer=${IDENTITY_ISSUER:http://localhost:8080}
agentshield.security.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:http://localhost:8080/oauth2/jwks}
agentshield.security.jwt.audience=${AGENT_MANAGEMENT_AUDIENCE:agentshield-api,agentshield-agent-management-api}
agentshield.security.cors.allowed-origins=${AGENT_CORS_ALLOWED_ORIGINS:http://localhost:3000}
