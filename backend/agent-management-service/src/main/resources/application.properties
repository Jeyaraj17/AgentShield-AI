spring.application.name=agent-management-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${AGENT_DB_URL}
spring.datasource.username=${AGENT_DB_USERNAME}
spring.datasource.password=${AGENT_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

agentshield.security.jwt.issuer=${IDENTITY_ISSUER:}
agentshield.security.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:}
agentshield.security.jwt.audience=${AGENT_MANAGEMENT_AUDIENCE:agentshield-api,agentshield-agent-management-api}
agentshield.security.runtime-gateway.client-id=${RUNTIME_GATEWAY_CLIENT_ID:agentshield-runtime-gateway}
agentshield.security.cors.allowed-origins=${AGENT_CORS_ALLOWED_ORIGINS:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.com.agentshield.agentmanagement=INFO
logging.level.org.springframework.security=WARN
spring.data.web.pageable.max-page-size=100
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
agentshield.events.queue=${EVENT_QUEUE:agentshield.agent-management.events}
agentshield.events.dead-letter-queue=${EVENT_DLQ:agentshield.agent-management.events.dlq}
agentshield.events.dispatcher.enabled=${EVENT_DISPATCHER_ENABLED:true}
agentshield.events.consumer.enabled=${EVENT_CONSUMER_ENABLED:true}
