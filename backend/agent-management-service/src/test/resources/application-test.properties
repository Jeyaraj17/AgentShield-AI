spring.datasource.url=jdbc:h2:mem:agentmanagementtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
agentshield.events.dispatcher.enabled=false
agentshield.events.consumer.enabled=false
agentshield.security.jwt.issuer=http://identity.test
agentshield.security.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks
agentshield.security.jwt.audience=agentshield-api
agentshield.security.cors.allowed-origins=http://localhost:3000
