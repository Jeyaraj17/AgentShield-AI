spring.datasource.url=jdbc:h2:mem:audit_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
agentshield.security.jwt.issuer=http://localhost:9000
agentshield.security.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks
agentshield.security.jwt.audience=agentshield-api,audit-service-api
agentshield.security.cors.allowed-origins=http://localhost:3000
agentshield.events.consumer.enabled=false
agentshield.events.dispatcher.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
