spring.application.name=audit-service
server.port=${SERVER_PORT:8086}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${AUDIT_DB_URL}
spring.datasource.username=${AUDIT_DB_USERNAME}
spring.datasource.password=${AUDIT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

agentshield.security.jwt.issuer=${IDENTITY_ISSUER:}
agentshield.security.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:}
agentshield.security.jwt.audience=${AUDIT_SERVICE_AUDIENCE:agentshield-api,audit-service-api}
agentshield.security.cors.allowed-origins=${AUDIT_CORS_ALLOWED_ORIGINS:}

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
agentshield.events.queue=${EVENT_QUEUE:agentshield.audit-service.events}
agentshield.events.dead-letter-queue=${EVENT_DLQ:agentshield.audit-service.events.dlq}
agentshield.events.dispatcher.enabled=false
agentshield.events.consumer.enabled=${EVENT_CONSUMER_ENABLED:true}
agentshield.events.consumer.max-attempts=${EVENT_CONSUMER_MAX_ATTEMPTS:4}
agentshield.events.consumer.initial-backoff-ms=${EVENT_CONSUMER_INITIAL_BACKOFF_MS:250}
agentshield.events.consumer.max-backoff-ms=${EVENT_CONSUMER_MAX_BACKOFF_MS:3000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.com.agentshield.audit=INFO
logging.pattern.level=%5p [correlationId:%X{correlationId:-}]
