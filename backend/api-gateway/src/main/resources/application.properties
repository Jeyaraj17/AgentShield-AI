spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s
spring.cloud.gateway.server.webflux.httpclient.wiretap=false
spring.cloud.gateway.server.webflux.httpserver.wiretap=false
agentshield.gateway.identity-service-url=${IDENTITY_SERVICE_URL}
agentshield.gateway.agent-management-service-url=${AGENT_MANAGEMENT_SERVICE_URL}
agentshield.gateway.policy-engine-service-url=${POLICY_ENGINE_SERVICE_URL}
agentshield.gateway.runtime-security-gateway-service-url=${RUNTIME_SECURITY_GATEWAY_SERVICE_URL}
agentshield.gateway.ai-analysis-service-url=${AI_ANALYSIS_SERVICE_URL}
agentshield.gateway.audit-service-url=${AUDIT_SERVICE_URL}
agentshield.gateway.notification-service-url=${NOTIFICATION_SERVICE_URL}
agentshield.gateway.public-url=${PUBLIC_GATEWAY_URL}
agentshield.security.jwt.issuer=${IDENTITY_ISSUER:}
agentshield.security.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:}
agentshield.security.jwt.audience=${API_GATEWAY_AUDIENCE:}
agentshield.security.jwt.agent-audience=${API_GATEWAY_AGENT_AUDIENCE:}
agentshield.security.cors.allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:}
agentshield.security.organization-onboarding.enabled=${GATEWAY_ORGANIZATION_ONBOARDING_ENABLED:false}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.webflux.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.root=INFO
logging.level.com.agentshield.apigateway=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.cloud.gateway=WARN
