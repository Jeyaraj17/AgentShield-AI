spring.datasource.url=jdbc:h2:mem:runtime_gateway_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
agentshield.events.dispatcher.enabled=false
agentshield.events.consumer.enabled=false
agentshield.security.jwt.issuer=http://identity.test
agentshield.security.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks
agentshield.security.jwt.audience=runtime-security-gateway-api
agentshield.identity.token-uri=http://localhost:8080/oauth2/token
agentshield.identity.runtime-gateway.client-id=runtime-gateway-test
agentshield.identity.runtime-gateway.client-secret=test-secret
agentshield.identity.runtime-gateway.analysis-client-id=runtime-gateway-analysis-test
agentshield.identity.runtime-gateway.analysis-client-secret=test-secret
agentshield.agent-management.base-url=http://localhost:8082
agentshield.policy-engine.base-url=http://localhost:8083
agentshield.ai-analysis.base-url=http://localhost:8085
