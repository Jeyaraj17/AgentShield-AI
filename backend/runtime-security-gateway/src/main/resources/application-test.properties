spring.datasource.url=jdbc:h2:mem:runtime_security_gateway;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
agentshield.security.jwt.issuer=http://localhost:19000
agentshield.security.jwt.jwk-set-uri=http://localhost:19000/oauth2/jwks
agentshield.security.jwt.audience=runtime-api
agentshield.identity.token-uri=http://localhost:19000/oauth2/token
agentshield.identity.runtime-gateway.client-id=runtime-gateway-test
agentshield.identity.runtime-gateway.client-secret=test-only-gateway-secret
agentshield.identity.runtime-gateway.analysis-client-id=runtime-gateway-analysis-test
agentshield.identity.runtime-gateway.analysis-client-secret=test-only-analysis-secret
agentshield.ai-analysis.base-url=http://localhost:18085
agentshield.ai-analysis.connect-timeout=1s
agentshield.ai-analysis.response-timeout=1s
agentshield.agent-management.base-url=http://localhost:18082
agentshield.policy-engine.base-url=http://localhost:18085
agentshield.runtime.tools.destinations=tool.echo=http://localhost:18090
agentshield.http.connect-timeout=1s
agentshield.http.response-timeout=1s
