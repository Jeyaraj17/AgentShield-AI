spring.application.name=runtime-security-gateway
server.port=${SERVER_PORT:8084}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${RUNTIME_DB_URL}
spring.datasource.username=${RUNTIME_DB_USERNAME}
spring.datasource.password=${RUNTIME_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

agentshield.security.jwt.issuer=${IDENTITY_ISSUER:}
agentshield.security.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:}
agentshield.security.jwt.audience=${RUNTIME_SECURITY_GATEWAY_AUDIENCE:}
agentshield.identity.token-uri=${IDENTITY_TOKEN_URI:}
agentshield.identity.runtime-gateway.client-id=${RUNTIME_GATEWAY_CLIENT_ID:}
agentshield.identity.runtime-gateway.client-secret=${RUNTIME_GATEWAY_CLIENT_SECRET:}
agentshield.identity.runtime-gateway.analysis-client-id=${RUNTIME_GATEWAY_ANALYSIS_CLIENT_ID:agentshield-runtime-gateway-analysis}
agentshield.identity.runtime-gateway.analysis-client-secret=${RUNTIME_GATEWAY_ANALYSIS_CLIENT_SECRET:}
agentshield.agent-management.base-url=${AGENT_MANAGEMENT_BASE_URL:}
agentshield.policy-engine.base-url=${POLICY_ENGINE_BASE_URL:}
agentshield.ai-analysis.base-url=${AI_ANALYSIS_BASE_URL:}
agentshield.ai-analysis.connect-timeout=${AI_ANALYSIS_CONNECT_TIMEOUT:2s}
agentshield.ai-analysis.response-timeout=${AI_ANALYSIS_RESPONSE_TIMEOUT:3s}
agentshield.runtime.tools.destinations=${RUNTIME_TOOL_DESTINATIONS:}

agentshield.http.connect-timeout=${RUNTIME_CONNECT_TIMEOUT:2s}
agentshield.http.response-timeout=${RUNTIME_RESPONSE_TIMEOUT:5s}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.com.agentshield.runtimesecurity=INFO
logging.level.org.springframework.security=WARN
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
agentshield.events.queue=${EVENT_QUEUE:agentshield.runtime-security-gateway.events}
agentshield.events.dead-letter-queue=${EVENT_DLQ:agentshield.runtime-security-gateway.events.dlq}
agentshield.events.dispatcher.enabled=${EVENT_DISPATCHER_ENABLED:true}
agentshield.events.consumer.enabled=${EVENT_CONSUMER_ENABLED:true}
