spring.datasource.url=${RUNTIME_DB_URL:jdbc:mysql://localhost:3306/runtime_security_gateway}
agentshield.security.jwt.issuer=${IDENTITY_ISSUER:http://localhost:8080}
agentshield.security.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:http://localhost:8080/oauth2/jwks}
agentshield.security.jwt.audience=${RUNTIME_SECURITY_GATEWAY_AUDIENCE:agentshield-runtime-api}
agentshield.identity.token-uri=${IDENTITY_TOKEN_URI:http://localhost:8080/oauth2/token}
agentshield.identity.runtime-gateway.client-id=${RUNTIME_GATEWAY_CLIENT_ID:agentshield-runtime-gateway}
agentshield.identity.runtime-gateway.client-secret=${RUNTIME_GATEWAY_CLIENT_SECRET:}
agentshield.identity.runtime-gateway.analysis-client-id=${RUNTIME_GATEWAY_ANALYSIS_CLIENT_ID:agentshield-runtime-gateway-analysis}
agentshield.identity.runtime-gateway.analysis-client-secret=${RUNTIME_GATEWAY_ANALYSIS_CLIENT_SECRET:}
agentshield.agent-management.base-url=${AGENT_MANAGEMENT_BASE_URL:http://localhost:8082}
agentshield.policy-engine.base-url=${POLICY_ENGINE_BASE_URL:http://localhost:8083}
agentshield.ai-analysis.base-url=${AI_ANALYSIS_BASE_URL:http://localhost:8085}
agentshield.ai-analysis.connect-timeout=${AI_ANALYSIS_CONNECT_TIMEOUT:2s}
agentshield.ai-analysis.response-timeout=${AI_ANALYSIS_RESPONSE_TIMEOUT:3s}
agentshield.runtime.tools.destinations=${RUNTIME_TOOL_DESTINATIONS:tool.echo=http://localhost:8090}
