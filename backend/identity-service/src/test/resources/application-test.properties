spring.datasource.url=jdbc:h2:mem:identitytest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
server.servlet.session.cookie.secure=false
agentshield.security.issuer=http://localhost:8080
agentshield.security.audience=agentshield-api
agentshield.security.spa.client-id=agentshield-react-spa
agentshield.security.spa.redirect-uri=http://localhost:3000/auth/callback
agentshield.security.jwt.generate-ephemeral-key=true
agentshield.security.cors.allowed-origins=http://localhost:3000
agentshield.security.organization-onboarding.enabled=true
agentshield.security.runtime-gateway.client-secret=test-only-runtime-gateway-secret
agentshield.security.runtime-gateway.analysis-client-secret=test-only-runtime-gateway-analysis-secret
agentshield.security.agent-management.base-url=http://localhost:8082
agentshield.security.agent.audience=agentshield-runtime-api
agentshield.security.agent-management.audience=agentshield-agent-management-api
agentshield.security.policy.audience=policy-engine-api
