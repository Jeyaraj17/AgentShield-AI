spring.config.import=optional:file:./application-local-secrets.properties
spring.jpa.hibernate.ddl-auto=update
server.servlet.session.cookie.secure=false
agentshield.security.issuer=${AUTH_ISSUER:http://localhost:8080}
agentshield.security.audience=${AUTH_AUDIENCE:agentshield-api}
agentshield.security.spa.redirect-uri=${AUTH_SPA_REDIRECT_URI:http://localhost:3000/auth/callback}
agentshield.security.jwt.generate-ephemeral-key=true
agentshield.security.cors.allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:3000}
agentshield.security.organization-onboarding.enabled=${IDENTITY_ONBOARDING_ENABLED:true}
agentshield.security.agent-management.base-url=${AGENT_MANAGEMENT_BASE_URL:http://localhost:8082}
