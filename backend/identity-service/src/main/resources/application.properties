spring.application.name=identity-service

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.forward-headers-strategy=none
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

agentshield.security.issuer=${AUTH_ISSUER:}
agentshield.security.audience=${AUTH_AUDIENCE:}
agentshield.security.spa.client-id=${AUTH_SPA_CLIENT_ID:agentshield-react-spa}
agentshield.security.spa.redirect-uri=${AUTH_SPA_REDIRECT_URI:}
agentshield.security.jwt.private-key-base64=${AUTH_SIGNING_PRIVATE_KEY_BASE64:}
agentshield.security.jwt.public-key-base64=${AUTH_SIGNING_PUBLIC_KEY_BASE64:}
agentshield.security.jwt.key-id=${AUTH_SIGNING_KEY_ID:agentshield-rsa-key-1}
agentshield.security.jwt.generate-ephemeral-key=false
agentshield.security.jwt.previous-public-keys=${AUTH_SIGNING_PREVIOUS_PUBLIC_KEYS:}
agentshield.security.cors.allowed-origins=${AUTH_CORS_ALLOWED_ORIGINS:}
agentshield.security.trusted-proxy-addresses=${TRUSTED_PROXY_ADDRESSES:}
agentshield.security.rate-limit.max-requests=${AUTH_RATE_LIMIT_MAX_REQUESTS:30}
agentshield.security.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
agentshield.security.organization-onboarding.enabled=${IDENTITY_ONBOARDING_ENABLED:false}
agentshield.security.onboarding-rate-limit.max-requests=${ONBOARDING_RATE_LIMIT_MAX_REQUESTS:3}
agentshield.security.onboarding-rate-limit.window-seconds=${ONBOARDING_RATE_LIMIT_WINDOW_SECONDS:3600}
agentshield.security.runtime-gateway.client-id=${RUNTIME_GATEWAY_CLIENT_ID:agentshield-runtime-gateway}
agentshield.security.runtime-gateway.client-secret=${RUNTIME_GATEWAY_CLIENT_SECRET:}
agentshield.security.runtime-gateway.previous-client-secret=${RUNTIME_GATEWAY_PREVIOUS_CLIENT_SECRET:}
agentshield.security.runtime-gateway.scopes=${RUNTIME_GATEWAY_SCOPES:policy.evaluate,agents.read}
agentshield.security.runtime-gateway.analysis-client-id=${RUNTIME_GATEWAY_ANALYSIS_CLIENT_ID:agentshield-runtime-gateway-analysis}
agentshield.security.runtime-gateway.analysis-client-secret=${RUNTIME_GATEWAY_ANALYSIS_CLIENT_SECRET:}
agentshield.security.runtime-gateway.analysis-previous-client-secret=${RUNTIME_GATEWAY_ANALYSIS_PREVIOUS_CLIENT_SECRET:}
agentshield.security.ai-analysis.audience=${AI_ANALYSIS_AUDIENCE:ai-analysis-api}
agentshield.security.agent-management.base-url=${AGENT_MANAGEMENT_BASE_URL:}
agentshield.security.agent.audience=${AGENT_TOKEN_AUDIENCE:agentshield-runtime-api}
agentshield.security.agent-management.audience=${AGENT_MANAGEMENT_SERVICE_AUDIENCE:agentshield-agent-management-api}
agentshield.security.policy.audience=${POLICY_ENGINE_AUDIENCE:policy-engine-api}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
