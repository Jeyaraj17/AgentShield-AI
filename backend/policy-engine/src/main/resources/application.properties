spring.application.name=policy-engine
server.port=${SERVER_PORT:8083}
spring.datasource.url=${POLICY_DB_URL}
spring.datasource.username=${POLICY_DB_USERNAME}
spring.datasource.password=${POLICY_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
agentshield.security.jwt.issuer=${IDENTITY_ISSUER:}
agentshield.security.jwt.jwk-set-uri=${IDENTITY_JWKS_URI:}
agentshield.security.jwt.audience=${POLICY_ENGINE_ALLOWED_AUDIENCES:agentshield-api,policy-engine-api}
agentshield.security.jwt.gateway-audience=${POLICY_ENGINE_AUDIENCE:policy-engine-api}
agentshield.security.jwt.agent-audience=${AGENT_TOKEN_AUDIENCE:agentshield-runtime-api}
agentshield.security.cors.allowed-origins=${POLICY_CORS_ALLOWED_ORIGINS:}
agentshield.security.runtime-gateway-client-id=${RUNTIME_GATEWAY_CLIENT_ID:}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.data.web.pageable.max-page-size=100
logging.level.root=INFO
logging.level.com.agentshield.policyengine=INFO
logging.level.org.springframework.security=WARN
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
agentshield.events.queue=${EVENT_QUEUE:agentshield.policy-engine.events}
agentshield.events.dead-letter-queue=${EVENT_DLQ:agentshield.policy-engine.events.dlq}
agentshield.events.dispatcher.enabled=${EVENT_DISPATCHER_ENABLED:true}
agentshield.events.consumer.enabled=${EVENT_CONSUMER_ENABLED:true}
