spring.datasource.url=jdbc:h2:mem:policy_engine;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
agentshield.security.jwt.issuer=http://localhost:9000
agentshield.security.jwt.jwk-set-uri=http://localhost/unused
agentshield.security.jwt.audience=agentshield-api
agentshield.security.jwt.gateway-audience=policy-engine-api
agentshield.security.jwt.agent-audience=agentshield-runtime-api
agentshield.security.cors.allowed-origins=http://localhost:3000
agentshield.security.runtime-gateway-client-id=runtime-gateway
